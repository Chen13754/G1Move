[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-move"
version = "0.1.0"
description = "A minimal timed wrapper for Unitree G1 native locomotion"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
g1-move = "g1_move.cli:main"

[tool.setuptools.packages.find]
include = ["g1_move*"]
